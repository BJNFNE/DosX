name: Android Build

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 3 * * *' 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone SafeNova Repository
        run: git clone https://github.com/DosX-dev/SafeNova.git SafeNova

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "SafeNova" "com.dosx.safenova" --web-dir "SafeNova/src"
          npx cap add android

      - name: Fix Kotlin Duplicate Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          # assembleRelease statt assembleDebug
          ./gradlew assembleRelease

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: '' # Leer lassen = nutzt automatisch einen generischen Test-Schlüssel

      - name: Rename APK
        run: |
          # Der signierte Build wird als SafeNova.apk umbenannt
          mv ${{steps.sign_app.outputs.signedReleaseFile}} SafeNova.apk

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build
          name: Android Build
          files: SafeNova.apk
